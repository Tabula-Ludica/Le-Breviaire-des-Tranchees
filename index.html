<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Bréviaire des Tranchées</title>
<meta name="description" content="Système de jeu de rôle non officiel dans l'univers de Trench Crusade — Tabula Ludica.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Cormorant+SC:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/breviaire.css?v=6">
</head>
<body>

<header class="titre">
  <div class="croix">✠ ✠ ✠</div>
  <h1>Le Bréviaire des Tranchées</h1>
  <div class="sous">Jeu de rôle dans l'univers de Trench Crusade · <a href="https://github.com/Tabula-Ludica">Tabula Ludica</a></div>
</header>

<div class="cadre">
  <div>
    <button class="bouton-sommaire" aria-expanded="false">✠ Sommaire</button>
    <nav class="sommaire" aria-label="Sommaire">
      <h2>Sommaire</h2>
      <ol id="liste-chapitres"></ol>
      <div class="outils"><a href="createur.html"><span class="num">✠</span><span>Créateur de personnage</span></a></div>
    </nav>
  </div>

  <main>
    <article class="page" id="page"><p class="chargement">Ouverture du Bréviaire…</p></article>
  </main>
</div>

<footer>
  Projet fan-made, non affilié à Factory Fortress Inc. Trench Crusade et son univers appartiennent à leurs auteurs.
</footer>

<script src="assets/marked.umd.js?v=4"></script>
<script>
  // Ajouter un chapitre = ajouter une ligne ici (fichier: null tant qu'il n'est pas écrit).
  const CHAPITRES = [
    { num: "I",   id: "01-le-noyau",         titre: "Le Noyau",                 fichier: "regles/01-le-noyau.md" },
    { num: "II",  id: "02-caracteristiques", titre: "Les Caractéristiques",     fichier: "regles/02-caracteristiques.md" },
    { num: "III", id: "03-creation",         titre: "La Création du personnage", fichier: "regles/03-creation.md" },
    { num: "IV",  id: "04-arcanes",          titre: "Les Arcanes",              fichier: "regles/04-arcanes.md", statut: "prototype" },
    { num: "V",   id: "05-combat",           titre: "Le Combat",                fichier: "regles/05-combat.md", statut: "prototype" },
    { num: "VI",  id: "06-progression",      titre: "La Progression",           fichier: "regles/06-progression.md", statut: "prototype" },
    { num: "VII", id: "07-corruption",       titre: "La Corruption",            fichier: "regles/07-corruption.md", statut: "prototype" },
    { num: "VIII", id: "08-damnes",          titre: "Jouer les Damnés",         fichier: "regles/08-damnes.md", statut: "prototype" },
    // ---- Codex : une seule entrée, avec un sélecteur d'onglets ----
    { groupe: "Codex", num: "✠", id: "codex", titre: "Le Codex", fichier: "codex/univers.md", statut: "preparation",
      onglets: [
        { id: "univers", titre: "L'Univers",   sous: "Le monde et son histoire",  icone: "✠", theme: "univers", fichier: "codex/univers.md" },
        { id: "fideles", titre: "Les Fidèles", sous: "Ceux qui tiennent la ligne", icone: "✝", theme: "fideles", fichier: "codex/fideles.md" },
        { id: "damnes",  titre: "Les Damnés",  sous: "Ceux qui ont choisi l'Enfer", icone: "⛧", theme: "damnes",  fichier: "codex/damnes.md" },
      ] },
  ];

  const STATUTS = {
    prototype:   { badge: "prototype",      bandeau: "<b>✠ Prototype</b> Ce chapitre est une première version de travail. Les effets ne sont pas encore testés en jeu et peuvent changer." },
    preparation: { badge: "en préparation", bandeau: "<b>✠ En préparation</b> Cette page pose la structure. Les passages marqués « à développer » restent à écrire." },
  };

  const page = document.getElementById("page");
  const liste = document.getElementById("liste-chapitres");
  const nav = document.querySelector("nav.sommaire");
  const bouton = document.querySelector(".bouton-sommaire");
  const cache = {};

  bouton.addEventListener("click", () => {
    const ouvert = nav.classList.toggle("ouvert");
    bouton.setAttribute("aria-expanded", ouvert);
  });

  const slug = t => t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

  function dessinerSommaire(actif, sections, base) {
    liste.innerHTML = "";
    let groupe = null;
    for (const c of CHAPITRES) {
      if ((c.groupe || null) !== groupe) {
        groupe = c.groupe || null;
        if (groupe) {
          const t = document.createElement("li");
          t.className = "groupe";
          t.textContent = groupe;
          liste.appendChild(t);
        }
      }
      const li = document.createElement("li");
      if (c.fichier) {
        const a = document.createElement("a");
        a.href = "#" + c.id;
        a.innerHTML = `<span class="num">${c.num}</span><span>${c.titre}${STATUTS[c.statut] ? `<small class="badge">${STATUTS[c.statut].badge}</small>` : ""}</span>`;
        if (actif && c.id === actif.id) a.classList.add("actif");
        li.appendChild(a);
        if (actif && c.id === actif.id && sections.length) {
          const sous = document.createElement("div");
          sous.className = "sections";
          for (const s of sections) {
            const sa = document.createElement("a");
            sa.href = "#" + (base || c.id) + "/" + s.id;
            sa.textContent = s.texte;
            sous.appendChild(sa);
          }
          li.appendChild(sous);
        }
      } else {
        li.innerHTML = `<span class="avenir"><span class="num">${c.num}</span><span>${c.titre}<small>à venir</small></span></span>`;
      }
      liste.appendChild(li);
    }
  }

  async function afficher() {
    const parts = decodeURIComponent(location.hash.slice(1)).split("/");
    const ecrits = CHAPITRES.filter(c => c.fichier);
    const chap = ecrits.find(c => c.id === parts[0]) || ecrits[0];

    // chapitres à onglets (le Codex) : #codex/fideles/section
    let onglet = null, idSection = parts[1];
    if (chap.onglets) {
      onglet = chap.onglets.find(o => o.id === parts[1]);
      idSection = onglet ? parts[2] : parts[1];
      onglet = onglet || chap.onglets[0];
    }
    const fichier = onglet ? onglet.fichier : chap.fichier;
    const base = onglet ? `${chap.id}/${onglet.id}` : chap.id;

    try {
      if (!cache[fichier]) {
        const r = await fetch(fichier, { cache: "no-cache" });
        if (!r.ok) throw new Error(r.status);
        cache[fichier] = await r.text();
      }
      page.innerHTML = marked.parse(cache[fichier]);
    } catch (e) {
      page.innerHTML = `<p class="erreur">Cette page du Bréviaire est illisible (${e.message}).</p>`;
      dessinerSommaire(chap, []);
      return;
    }

    // bandeau « prototype »
    if (STATUTS[chap.statut]) {
      const bandeau = document.createElement("div");
      bandeau.className = "bandeau-prototype";
      bandeau.innerHTML = STATUTS[chap.statut].bandeau;
      page.prepend(bandeau);
    }

    // sélecteur d'onglets
    if (chap.onglets) {
      const sel = document.createElement("nav");
      sel.className = "selecteur";
      sel.setAttribute("aria-label", chap.titre);
      sel.innerHTML = chap.onglets.map(o => `
        <a href="#${chap.id}/${o.id}" class="choix theme-${o.theme}${o === onglet ? " actif" : ""}"${o === onglet ? ' aria-current="page"' : ""}>
          <span class="icone">${o.icone}</span><span class="titre">${o.titre}</span><span class="sous">${o.sous}</span>
        </a>`).join("");
      (page.querySelector(".bandeau-prototype") || page.firstChild).after(sel);
    }

    // galerie de tarot dans le chapitre IV
    if (chap.id === "04-arcanes") construireGalerie();

    // bouton du créateur de personnage dans le chapitre III
    if (chap.id === "03-creation") {
      const encart = document.createElement("div");
      encart.className = "encart-outil";
      encart.innerHTML = '<a class="bouton-outil" href="createur.html">✠ Ouvrir le créateur de personnage</a>';
      const apres = page.querySelector("h1 + blockquote") || page.querySelector("h1");
      apres.after(encart);
    }

    // ancres sur les titres de section
    const sections = [];
    page.querySelectorAll("h2, h3").forEach(h => {
      h.id = slug(h.textContent);
      if (h.tagName === "H2") sections.push({ id: h.id, texte: h.textContent.replace(/^\d+\.\s*/, "") });
    });

    // précédent / suivant
    const i = ecrits.indexOf(chap);
    const prec = ecrits[i - 1], suiv = ecrits[i + 1];
    if (prec || suiv) {
      const div = document.createElement("div");
      div.className = "suite";
      div.innerHTML =
        (prec ? `<a href="#${prec.id}">← ${prec.num}. ${prec.titre}</a>` : "<span></span>") +
        (suiv ? `<a href="#${suiv.id}">${suiv.num}. ${suiv.titre} →</a>` : "<span></span>");
      page.appendChild(div);
    }

    document.title = `${onglet ? onglet.titre : chap.titre} · Le Bréviaire des Tranchées`;
    dessinerSommaire(chap, sections, base);
    nav.classList.remove("ouvert");
    bouton.setAttribute("aria-expanded", "false");

    if (idSection) document.getElementById(idSection)?.scrollIntoView();
    else window.scrollTo(0, 0);
  }

  /* ---------- Galerie des arcanes ----------
     Les données sont lues directement dans le chapitre (titres ### et listes),
     donc il n'y a rien à dupliquer : modifier le .md suffit.
     Visuels : assets/arcanes/01.webp … 22.webp (sinon .png, sinon .jpg, sinon carte de remplacement). */
  const FORMATS = ["webp", "png", "jpg"];

  function chargerVisuel(img, base, i = 0) {
    if (i >= FORMATS.length) { img.closest(".arcane").classList.add("sans-visuel"); img.remove(); return; }
    img.onerror = () => chargerVisuel(img, base, i + 1);
    img.src = `${base}.${FORMATS[i]}`;
  }

  function construireGalerie() {
    const cartes = [];
    page.querySelectorAll("h3").forEach(h => {
      const [num, nom] = h.textContent.split(" · ");
      const ul = h.nextElementSibling;
      if (!nom || !ul || ul.tagName !== "UL") return;
      const effets = [...ul.children].map(li => {
        const fort = li.querySelector("strong");
        const [type, titre] = fort.textContent.replace(/\.$/, "").split(" : ");
        const corps = li.cloneNode(true); corps.querySelector("strong").remove();
        return { type, titre, texte: corps.innerHTML.trim() };
      });
      cartes.push({ num: num.trim(), nom: nom.trim(), effets, ancre: h.id });
    });
    if (!cartes.length) return;

    const galerie = document.createElement("div");
    galerie.className = "galerie-arcanes";
    cartes.forEach((c, i) => {
      const fichier = String(i + 1).padStart(2, "0");   // 01 = Le Mat … 22 = Le Monde
      const carte = document.createElement("a");
      carte.className = "arcane";
      carte.href = `#04-arcanes/${c.ancre}`;
      carte.innerHTML = `
        <div class="visuel"><img alt="${c.nom}" loading="lazy"></div>
        <div class="remplacement"><span class="chiffre">${c.num}</span><span class="croix">✠</span><span class="nom">${c.nom}</span></div>
        <div class="legende"><span>${c.num}</span> ${c.nom}</div>`;
      chargerVisuel(carte.querySelector("img"), `assets/arcanes/${fichier}`);
      carte.dataset.index = i;
      galerie.appendChild(carte);
    });

    const titre = [...page.querySelectorAll("h2")].find(h => /vingt-deux/i.test(h.textContent));
    const intro = document.createElement("p");
    intro.className = "aide-galerie";
    intro.textContent = "Passez la souris sur une carte (ou touchez-la) pour lire ses effets. Cliquez pour aller au texte complet.";
    titre.after(intro, galerie);

    // info-bulle partagée
    let bulle = document.querySelector(".bulle-arcane");
    if (!bulle) { bulle = document.createElement("div"); bulle.className = "bulle-arcane"; document.body.appendChild(bulle); }

    let courant = null;
    const montrer = el => {
      courant = el;
      const c = cartes[+el.dataset.index];
      bulle.innerHTML = `<div class="titre"><span>${c.num}</span> ${c.nom}</div>` +
        c.effets.map(e => `<div class="effet effet-${e.type.normalize("NFD").replace(/[^a-z]/gi, "").toLowerCase()}">
          <b>${e.type}</b><i>${e.titre}</i><p>${e.texte}</p></div>`).join("");
      bulle.classList.add("visible");
      const r = el.getBoundingClientRect(), b = bulle.getBoundingClientRect(), m = 12;
      let x = r.right + m;
      if (x + b.width > innerWidth - m) x = r.left - b.width - m;
      if (x < m) x = Math.max(m, (innerWidth - b.width) / 2);
      let y = r.top + r.height / 2 - b.height / 2;
      y = Math.max(m, Math.min(y, innerHeight - b.height - m));
      bulle.style.left = x + "px"; bulle.style.top = y + "px";
    };
    const cacher = () => { courant = null; bulle.classList.remove("visible"); };

    galerie.querySelectorAll(".arcane").forEach(el => {
      el.addEventListener("mouseenter", () => montrer(el));
      el.addEventListener("mouseleave", cacher);
      el.addEventListener("focus", () => montrer(el));
      el.addEventListener("blur", cacher);
      // écran tactile : premier toucher = afficher, second = suivre le lien
      el.addEventListener("touchstart", ev => {
        if (!el.classList.contains("touche")) {
          ev.preventDefault();
          galerie.querySelectorAll(".touche").forEach(x => x.classList.remove("touche"));
          el.classList.add("touche"); montrer(el);
        }
      }, { passive: false });
    });
    // au défilement, la bulle suit la carte (ou disparaît si la carte sort de l'écran)
    addEventListener("scroll", () => {
      if (!courant) return;
      if (!courant.isConnected) return cacher();
      const r = courant.getBoundingClientRect();
      if (r.bottom < 0 || r.top > innerHeight) cacher(); else montrer(courant);
    }, { passive: true });
  }

  window.addEventListener("hashchange", () => { document.querySelector(".bulle-arcane")?.classList.remove("visible"); });
  window.addEventListener("hashchange", afficher);
  afficher();
</script>
</body>
</html>
