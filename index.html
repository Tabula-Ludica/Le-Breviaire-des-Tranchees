<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Bréviaire des Tranchées</title>
<meta name="description" content="Système de jeu de rôle non officiel dans l'univers de Trench Crusade — Tabula Ludica.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Cormorant+SC:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/breviaire.css">
</head>
<body>

<header class="titre">
  <div class="croix">✠ ✠ ✠</div>
  <h1>Le Bréviaire des Tranchées</h1>
  <div class="sous">Jeu de rôle dans l'univers de Trench Crusade · <a href="https://github.com/Tabula-Ludica">Tabula Ludica</a></div>
</header>

<div class="cadre">
  <div>
    <button class="bouton-sommaire" aria-expanded="false">✠ Sommaire</button>
    <nav class="sommaire" aria-label="Sommaire">
      <h2>Sommaire</h2>
      <ol id="liste-chapitres"></ol>
      <div class="outils"><a href="createur.html"><span class="num">✠</span><span>Créateur de personnage</span></a></div>
    </nav>
  </div>

  <main>
    <article class="page" id="page"><p class="chargement">Ouverture du Bréviaire…</p></article>
  </main>
</div>

<footer>
  Projet fan-made, non affilié à Factory Fortress Inc. Trench Crusade et son univers appartiennent à leurs auteurs.
</footer>

<script src="assets/marked.umd.js"></script>
<script>
  // Ajouter un chapitre = ajouter une ligne ici (fichier: null tant qu'il n'est pas écrit).
  const CHAPITRES = [
    { num: "I",   id: "01-le-noyau",         titre: "Le Noyau",                 fichier: "regles/01-le-noyau.md" },
    { num: "II",  id: "02-caracteristiques", titre: "Les Caractéristiques",     fichier: "regles/02-caracteristiques.md" },
    { num: "III", id: "03-creation",         titre: "La Création du personnage", fichier: "regles/03-creation.md" },
    { num: "IV",  id: "04-arcanes",          titre: "Les Arcanes",              fichier: null },
  ];

  const page = document.getElementById("page");
  const liste = document.getElementById("liste-chapitres");
  const nav = document.querySelector("nav.sommaire");
  const bouton = document.querySelector(".bouton-sommaire");
  const cache = {};

  bouton.addEventListener("click", () => {
    const ouvert = nav.classList.toggle("ouvert");
    bouton.setAttribute("aria-expanded", ouvert);
  });

  const slug = t => t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

  function dessinerSommaire(actif, sections) {
    liste.innerHTML = "";
    for (const c of CHAPITRES) {
      const li = document.createElement("li");
      if (c.fichier) {
        const a = document.createElement("a");
        a.href = "#" + c.id;
        a.innerHTML = `<span class="num">${c.num}</span><span>${c.titre}</span>`;
        if (actif && c.id === actif.id) a.classList.add("actif");
        li.appendChild(a);
        if (actif && c.id === actif.id && sections.length) {
          const sous = document.createElement("div");
          sous.className = "sections";
          for (const s of sections) {
            const sa = document.createElement("a");
            sa.href = "#" + c.id + "/" + s.id;
            sa.textContent = s.texte;
            sous.appendChild(sa);
          }
          li.appendChild(sous);
        }
      } else {
        li.innerHTML = `<span class="avenir"><span class="num">${c.num}</span><span>${c.titre}<small>à venir</small></span></span>`;
      }
      liste.appendChild(li);
    }
  }

  async function afficher() {
    const [idChap, idSection] = decodeURIComponent(location.hash.slice(1)).split("/");
    const ecrits = CHAPITRES.filter(c => c.fichier);
    const chap = ecrits.find(c => c.id === idChap) || ecrits[0];

    try {
      if (!cache[chap.id]) {
        const r = await fetch(chap.fichier, { cache: "no-cache" });
        if (!r.ok) throw new Error(r.status);
        cache[chap.id] = await r.text();
      }
      page.innerHTML = marked.parse(cache[chap.id]);
    } catch (e) {
      page.innerHTML = `<p class="erreur">Cette page du Bréviaire est illisible (${e.message}).</p>`;
      dessinerSommaire(chap, []);
      return;
    }

    // bouton du créateur de personnage dans le chapitre III
    if (chap.id === "03-creation") {
      const encart = document.createElement("div");
      encart.className = "encart-outil";
      encart.innerHTML = '<a class="bouton-outil" href="createur.html">✠ Ouvrir le créateur de personnage</a>';
      const apres = page.querySelector("h1 + blockquote") || page.querySelector("h1");
      apres.after(encart);
    }

    // ancres sur les titres de section
    const sections = [];
    page.querySelectorAll("h2, h3").forEach(h => {
      h.id = slug(h.textContent);
      if (h.tagName === "H2") sections.push({ id: h.id, texte: h.textContent.replace(/^\d+\.\s*/, "") });
    });

    // précédent / suivant
    const i = ecrits.indexOf(chap);
    const prec = ecrits[i - 1], suiv = ecrits[i + 1];
    if (prec || suiv) {
      const div = document.createElement("div");
      div.className = "suite";
      div.innerHTML =
        (prec ? `<a href="#${prec.id}">← ${prec.num}. ${prec.titre}</a>` : "<span></span>") +
        (suiv ? `<a href="#${suiv.id}">${suiv.num}. ${suiv.titre} →</a>` : "<span></span>");
      page.appendChild(div);
    }

    document.title = `${chap.titre} · Le Bréviaire des Tranchées`;
    dessinerSommaire(chap, sections);
    nav.classList.remove("ouvert");
    bouton.setAttribute("aria-expanded", "false");

    if (idSection) document.getElementById(idSection)?.scrollIntoView();
    else window.scrollTo(0, 0);
  }

  window.addEventListener("hashchange", afficher);
  afficher();
</script>
</body>
</html>
